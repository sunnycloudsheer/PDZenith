<template>
    <template lwc:if={isCancelMode}>
        <c-guest-reschedule-cancel></c-guest-reschedule-cancel>
    </template>

    <template lwc:elseif={isLoading}>
        <div class="widget-shell">
            <div class="loader-wrap">
                <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
                <p class="loader-label">Loading available times...</p>
            </div>
        </div>
    </template>

    <template lwc:elseif={hasFatalError}>
        <div class="widget-shell widget-shell--narrow">
            <div class="error-wrap">
                <p class="error-heading">Booking Unavailable</p>
                <p class="error-body">We're having trouble loading the booking form. Please refresh the page or call us directly.</p>
                <template lwc:if={fatalErrorDetail}>
                    <p class="error-body error-detail">{fatalErrorDetail}</p>
                </template>
            </div>
        </div>
    </template>

    <template lwc:elseif={isLinkAlreadyUsed}>
        <div class="widget-shell widget-shell--narrow">
            <div class="error-wrap">
                <p class="error-heading">{linkUsedHeading}</p>
                <p class="error-body">{linkUsedBody}</p>
            </div>
        </div>
    </template>

    <template lwc:elseif={isReady}>
        <div class="widget-shell">

            <template lwc:if={isRescheduling}>
                <div class="reschedule-banner">
                    <div class="reschedule-banner-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <polyline points="1 20 1 14 7 14"></polyline>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                        </svg>
                    </div>
                    <div class="reschedule-banner-text">
                        <p class="reschedule-banner-title">RESCHEDULING YOUR MEETING</p>
                        <template lwc:if={originalStartCompact}>
                            <p class="reschedule-banner-detail">
                                Currently scheduled for <strong>{originalStartCompact}</strong>{rescheduleWithCounselor}
                            </p>
                        </template>
                    </div>
                </div>
            </template>

            <template lwc:if={showTwoStepTrack}>
                <div class="step-track">
                    <div class={step1NodeClass}>
                        <span class="step-dot">
                            <template lwc:if={isStep1Complete}>
                                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </template>
                            <template lwc:else>1</template>
                        </span>
                        <span class="step-text">CHOOSE TIME</span>
                    </div>
                    <div class={connector1Class}></div>
                    <div class={step2NodeClass}>
                        <span class="step-dot">
                            <template lwc:if={isStep2Complete}>
                                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </template>
                            <template lwc:else>2</template>
                        </span>
                        <span class="step-text">YOUR INFO</span>
                    </div>
                    <div class={connector2Class}></div>
                    <div class={step3NodeClass}>
                        <span class="step-dot">3</span>
                        <span class="step-text">CONFIRM</span>
                    </div>
                </div>
            </template>
            <template lwc:else>
                <div class="step-track">
                    <div class="step-node active">
                        <span class="step-dot">1</span>
                        <span class="step-text">SELECT TIME &amp; BOOK</span>
                    </div>
                </div>
            </template>

            <template lwc:if={isStep1}>
                <div class="split-panel">
                    <!-- ───────── NAVY SUMMARY PANEL ───────── -->
                    <aside class="summary-panel">
                        <div class="brand-row">
                            <div class="brand-mark">
                                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-label="Zenith Prep Academy">
                                    <path d="M3 21 L11 4 L19 21 Z" fill="#1A2849" opacity="0.35"/>
                                    <path d="M7 21 L14 6 L21 21 Z" fill="#1A2849"/>
                                </svg>
                            </div>
                            <span class="brand-text">Zenith Prep Academy</span>
                        </div>

                        <p class="summary-title">{headerLabel}</p>

                        <div class="summary-meta-row">
                            <span class="summary-meta-icon">&#x1F552;</span>
                            <span>{durationLabel}</span>
                        </div>
                        <div class="summary-meta-row">
                            <span class="summary-meta-icon">&#x1F4F9;</span>
                            <span>Zoom video call</span>
                        </div>
                        <div class="summary-meta-row">
                            <span class="summary-meta-icon">&#x1F310;</span>
                            <span>{timezoneDisplay}</span>
                        </div>

                        <template lwc:if={isRescheduling}>
                            <hr class="summary-divider" />
                            <p class="summary-section-label">Current Booking</p>
                            <div class="summary-meeting-card">
                                <p class="summary-meeting-detail">
                                    <span class="summary-meta-icon">&#x1F4C5;</span>
                                    <span>{originalStartDisplay}</span>
                                </p>
                            </div>
                        </template>
                    </aside>

                    <!-- ───────── CALENDAR PANEL ───────── -->
                    <div class="panel-left">
                        <div class="cal-month-nav">
                            <button class="cal-nav-btn" onclick={prevMonth} disabled={prevMonthDisabled}>&#8249;</button>
                            <span class="cal-month-label">{currentMonthLabel}</span>
                            <button class="cal-nav-btn" onclick={nextMonth} disabled={nextMonthDisabled}>&#8250;</button>
                        </div>

                        <div class="cal-grid cal-header-row">
                            <span class="cal-hdr">SUN</span><span class="cal-hdr">MON</span>
                            <span class="cal-hdr">TUE</span><span class="cal-hdr">WED</span>
                            <span class="cal-hdr">THU</span><span class="cal-hdr">FRI</span>
                            <span class="cal-hdr">SAT</span>
                        </div>

                        <div class="cal-grid">
                            <template for:each={calendarDays} for:item="day">
                                <template lwc:if={day.isEmpty}>
                                    <span key={day.key} class="cal-cell empty"></span>
                                </template>
                                <template lwc:elseif={day.isDisabled}>
                                    <span key={day.key} class="cal-cell disabled">{day.num}</span>
                                </template>
                                <template lwc:else>
                                    <button key={day.key} class={day.cssClass}
                                            data-date={day.dateStr}
                                            onclick={handleDateClick}>{day.num}</button>
                                </template>
                            </template>
                        </div>
                    </div>

                    <!-- ───────── TIME SLOTS PANEL ───────── -->
                    <div class="panel-right">

                        <template lwc:if={showAssignedPdBanner}>
                            <div class="pd-banner">
                                <span class="pd-banner-icon">&#x1F464;</span>
                                <span class="pd-banner-text">{assignedPdDisplay}</span>
                            </div>
                        </template>

                        <template lwc:if={bookingError}>
                            <div class="val-error step1-error">{bookingError}</div>
                        </template>

                        <template lwc:if={selectedDate}>
                            <div class="info-block">
                                <p class="info-label">{selectedDateLong}</p>
                                <p class="info-sublabel">Available times</p>
                            </div>

                            <template lwc:if={isSlotsLoading}>
                                <div class="slots-loading">
                                    <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
                                </div>
                            </template>

                            <template lwc:elseif={hasSlots}>
                                <div class="slots-list">
                                    <template for:each={timeSlots} for:item="slot">
                                        <button key={slot.startUtc}
                                                class="slot-btn"
                                                data-start={slot.startUtc}
                                                data-end={slot.endUtc}
                                                disabled={isSubmitting}
                                                onclick={handleSlotClick}>{slot.displayTime}</button>
                                    </template>
                                </div>
                            </template>

                            <template lwc:elseif={noSlotsForDate}>
                                <div class="no-slots-msg">
                                    <p>No available times on this date.</p>
                                    <p>Please select another day.</p>
                                </div>
                            </template>
                        </template>

                        <template lwc:if={noDateSelected}>
                            <div class="pick-date-prompt">
                                <p>&#8592; Select a date<br/>to see available times</p>
                            </div>
                        </template>
                    </div>

                    <template lwc:if={isSubmitting}>
                        <div class="booking-overlay">
                            <div class="booking-overlay-card">
                                <lightning-spinner alternative-text="Booking..." size="small"></lightning-spinner>
                                <p class="booking-overlay-text">Booking your meeting&hellip;</p>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <template lwc:if={isStep2}>
                <template lwc:if={isICMode}>
                <div class="split-panel">
                    <!-- ───────── NAVY SUMMARY PANEL ───────── -->
                    <aside class="summary-panel">
                        <div class="brand-row">
                            <div class="brand-mark">
                                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-label="Zenith Prep Academy">
                                    <path d="M3 21 L11 4 L19 21 Z" fill="#1A2849" opacity="0.35"/>
                                    <path d="M7 21 L14 6 L21 21 Z" fill="#1A2849"/>
                                </svg>
                            </div>
                            <span class="brand-text">Zenith Prep Academy</span>
                        </div>

                        <p class="summary-section-label">Your Meeting</p>
                        <div class="summary-meeting-card">
                            <p class="summary-meeting-detail">
                                <span class="summary-meta-icon">
                                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                        <line x1="16" y1="2" x2="16" y2="6"></line>
                                        <line x1="8" y1="2" x2="8" y2="6"></line>
                                        <line x1="3" y1="10" x2="21" y2="10"></line>
                                    </svg>
                                </span>
                                <span>{selectedDateLong}</span>
                            </p>
                            <p class="summary-meeting-detail">
                                <span class="summary-meta-icon">
                                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <polyline points="12 6 12 12 16 14"></polyline>
                                    </svg>
                                </span>
                                <span>{selectedTimeDisplay}</span>
                            </p>
                            <button class="summary-edit-link" onclick={handleEditTime}>Edit time</button>
                        </div>

                        <template lwc:if={showCounselorBlock}>
                            <div class="summary-counselor-row">
                                <div class="summary-counselor-avatar">{counselorInitials}</div>
                                <div class="summary-counselor-text">
                                    <p class="summary-counselor-name">{counselorDisplayName}</p>
                                    <p class="summary-counselor-role">{counselorRole}</p>
                                </div>
                            </div>
                        </template>

                        <hr class="summary-divider" />

                        <div class="summary-meta-row">
                            <span class="summary-meta-icon">
                                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="23 7 16 12 23 17 23 7"></polygon>
                                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                                </svg>
                            </span>
                            <span>Zoom video call</span>
                        </div>
                        <div class="summary-meta-row">
                            <span class="summary-meta-icon">
                                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="2" y1="12" x2="22" y2="12"></line>
                                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                                </svg>
                            </span>
                            <span>{timezoneDisplay}</span>
                        </div>
                    </aside>

                    <!-- ───────── FORM PANEL ───────── -->
                    <div class="form-panel form-panel--in-split">
                    <div class="form-header">
                        <h2 class="form-title">Your information</h2>
                        <p class="form-location">{formSubtitle}</p>
                    </div>

                    <p class="form-section-label">Contact</p>

                    <div class="field-row-2">
                        <div class="field-group">
                            <label class="field-lbl">First name <span class="req">*</span></label>
                            <input type="text" class="field-inp" value={firstName}
                                   data-field="firstName" oninput={handleInput} />
                        </div>
                        <div class="field-group">
                            <label class="field-lbl">Last name <span class="req">*</span></label>
                            <input type="text" class="field-inp" value={lastName}
                                   data-field="lastName" oninput={handleInput} />
                        </div>
                    </div>

                    <div class="field-group">
                        <label class="field-lbl">Email <span class="req">*</span></label>
                        <input type="email" class="field-inp" value={email}
                               placeholder="parent@example.com"
                               data-field="email" oninput={handleInput} />
                    </div>

                    <div class="field-group">
                        <label class="field-lbl">Phone number <span class="req">*</span></label>
                        <input type="tel" class="field-inp" value={phone}
                               placeholder="98XXX XXXXX"
                               data-field="phone" oninput={handleInput} />
                    </div>

                    <p class="form-section-label">Student details</p>

                    <div class="field-group">
                        <label class="field-lbl">Student grade <span class="req">*</span></label>
                        <select class="field-inp field-inp--select"
                                data-field="studentGrade" onchange={handleInput}>
                            <template for:each={gradeSelectOptions} for:item="g">
                                <option key={g.value} value={g.value} selected={g.isSelected}>{g.label}</option>
                            </template>
                        </select>
                    </div>

                    <p class="form-section-label">Acknowledgements</p>

                    <div class="policy-banner">
                        <span class="policy-banner-icon">!</span>
                        <span>Slots are limited. If you miss your consultation, future free consultations may not be available. Reschedules require <strong>3+ days notice</strong>.</span>
                    </div>

                    <label class={confirm1RowClass}>
                        <input type="checkbox" checked={confirm1Checked} onchange={handleConfirm1} />
                        <span>I commit to attending this consultation</span>
                    </label>
                    <label class={confirm2RowClass}>
                        <input type="checkbox" checked={confirm2Checked} onchange={handleConfirm2} />
                        <span>I acknowledge the rescheduling policy above</span>
                    </label>

                    <p class="form-section-label">Optional</p>

                    <div class="field-group">
                        <label class="field-lbl">
                            Anything you'd like us to know?
                            <span class="field-lbl-optional">(saved to your record)</span>
                        </label>
                        <textarea class="field-inp field-inp--area"
                                  data-field="notes" oninput={handleInput}
                                  rows="3"
                                  placeholder="Share questions, goals, or context for the call...">{notes}</textarea>
                    </div>

                    <div class="field-group">
                        <label class="field-lbl">
                            Add guest emails
                            <span class="field-lbl-optional">(comma-separated, will be invited to the meeting)</span>
                        </label>
                        <input type="text" class="field-inp" value={guestEmails}
                               placeholder="parent@example.com, student@example.com"
                               data-field="guestEmails" oninput={handleInput} />
                    </div>

                    <p class="form-section-label">Data privacy</p>
                    <div class="privacy-box">
                        <p class="privacy-body">
                            Zenith Prep Academy is committed to protecting and respecting your privacy, and we'll only use your personal information to administer your account and to provide the products and services you requested from us. From time to time, we would like to contact you about our products and services, as well as other content that may be of interest to you. If you consent to us contacting you for this purpose, please tick below to say how you would like us to contact you:
                        </p>
                        <label class="check-row">
                            <input type="checkbox" checked={consentChecked}
                                   onchange={handleConsent} />
                            <span>I agree to receive other communications from Zenith Prep Academy.</span>
                        </label>
                        <p class="privacy-body privacy-body--secondary">
                            You can unsubscribe from these communications at any time. For more information on how to unsubscribe, our privacy practices, and how we are committed to protecting and respecting your privacy, please review our <a href="https://www.zenithprepacademy.com/privacy-policy" target="_blank" rel="noopener">Privacy Policy</a>.
                        </p>
                        <p class="privacy-body privacy-body--secondary">
                            By clicking submit below, you consent to allow Zenith Prep Academy to store and process the personal information submitted above to provide you the content requested.
                        </p>
                    </div>

                    <template lwc:if={validationError}>
                        <div class="val-error">{validationError}</div>
                    </template>

                    <div class="form-footer">
                        <button class="back-btn" onclick={handleBack}>&#8249; Back</button>
                        <button class="confirm-btn" onclick={handleSubmit} disabled={isSubmitting}>
                            <template lwc:if={isSubmitting}>Booking...</template>
                            <template lwc:else>Confirm meeting</template>
                        </button>
                    </div>
                    </div>
                </div>
                </template>
            </template>

            <template lwc:if={isStep3}>
                <div class="confirmed-panel">
                    <div class="confirmed-hero">
                        <div class="confirmed-check"></div>
                        <h2 class="confirmed-title">{confirmationGreeting}</h2>
                        <template lwc:if={email}>
                            <p class="confirmed-text">A confirmation has been sent to <strong>{email}</strong>.</p>
                        </template>
                        <template lwc:else>
                            <p class="confirmed-text">Your {headerLabel} is confirmed.</p>
                        </template>
                    </div>

                    <div class="confirmed-card-wrap">
                        <div class="confirmed-meeting-card">
                            <div class="confirmed-meeting-header">
                                <p class="confirmed-meeting-title">{headerLabel}</p>
                                <span class="status-pill status-pill--confirmed">Confirmed</span>
                            </div>
                            <div class="confirmed-meeting-grid">
                                <div class="confirmed-meeting-row">
                                    <span class="confirmed-meeting-label">Date</span>
                                    <p class="confirmed-meeting-value">{selectedDateLong}</p>
                                </div>
                                <div class="confirmed-meeting-row">
                                    <span class="confirmed-meeting-label">Time</span>
                                    <p class="confirmed-meeting-value">{selectedTimeDisplay}</p>
                                </div>
                            </div>
                            <div class="confirmed-meeting-location">
                                <span class="summary-meta-icon">&#x1F4F9;</span>
                                <span>Zoom video call &mdash; link will arrive in your email</span>
                            </div>
                        </div>

                        <div class="confirmed-actions">
                            <template lwc:if={addToCalendarUrl}>
                                <a class="confirmed-action-btn confirmed-action-btn--primary"
                                   href={addToCalendarUrl} target="_blank" rel="noopener">
                                    Add to calendar
                                </a>
                            </template>
                            <template lwc:if={rescheduleUrl}>
                                <a class="confirmed-action-btn confirmed-action-btn--secondary"
                                   href={rescheduleUrl}>
                                    Reschedule
                                </a>
                            </template>
                            <template lwc:if={cancelUrl}>
                                <a class="confirmed-action-btn confirmed-action-btn--danger"
                                   href={cancelUrl}>
                                    Cancel
                                </a>
                            </template>
                        </div>

                        <div class="prep-list">
                            <p class="prep-list-title">Before your meeting</p>
                            <ol class="prep-list-items">
                                <li><span class="prep-num">1</span> Test your Zoom audio and video &mdash; the link works on phone, tablet, or laptop.</li>
                                <li><span class="prep-num">2</span> Have your student's transcript and any test scores handy if you have them.</li>
                                <li><span class="prep-num">3</span> Jot down 2&ndash;3 questions about your student's college goals to make the most of the call.</li>
                            </ol>
                        </div>

                        <p class="confirmed-redirect">Redirecting you in a moment&hellip;</p>
                    </div>
                </div>
            </template>

        </div>
    </template>
</template>
