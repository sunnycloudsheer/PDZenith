<template>
    <!-- Loading state -->
    <template lwc:if={isLoading}>
        <div class="widget-shell">
            <div class="loader-wrap">
                <div class="dot-spinner" role="status" aria-label="Loading">
                    <span></span><span></span><span></span>
                </div>
                <p class="loader-label">Verifying your appointment...</p>
            </div>
        </div>
    </template>

    <!-- Error state -->
    <template lwc:elseif={hasError}>
        <div class="widget-shell">
            <div class="error-wrap">
                <div class="error-icon">&#x26A0;</div>
                <p class="error-heading">{errorTitle}</p>
                <p class="error-body">{errorMessage}</p>
                <p class="error-contact">
                    Need help? Contact us at <a href="mailto:info@zenithprepacademy.com">info@zenithprepacademy.com</a>
                </p>
            </div>
        </div>
    </template>

    <!-- Main content -->
    <template lwc:elseif={isReady}>
        <div class="widget-shell">

            <!-- Brand header strip -->
            <div class="appt-header">
                <div class="brand-logo-placeholder">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-label="Zenith Prep Academy">
                        <path d="M3 21 L11 4 L19 21 Z" fill="#1A2849" opacity="0.35"/>
                        <path d="M7 21 L14 6 L21 21 Z" fill="#1A2849"/>
                    </svg>
                </div>
                <p class="appt-title">Zenith Prep Academy</p>
            </div>

            <!-- Appointment details + actions (when not in cancel form) -->
            <template lwc:if={showAppointmentDetails}>
                <div class="cancel-form-header">
                    <div class="cancel-form-heading-block">
                        <h2 class="cancel-title">Manage your appointment</h2>
                        <p class="cancel-subtitle">Choose what you'd like to do with this consultation.</p>
                    </div>
                </div>

                <div class="appt-details">
                    <div class="appt-summary-row">
                        <div class="appt-summary-text">
                            <p class="appt-summary-name">Initial consultation</p>
                            <p class="appt-summary-counselor">with your counselor</p>
                        </div>
                    </div>
                    <div class="detail-grid">
                        <div class="detail-row">
                            <span class="detail-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
                                     aria-hidden="true">
                                    <rect x="3" y="5" width="18" height="16" rx="2"/>
                                    <path d="M3 9h18"/>
                                    <path d="M8 3v4"/>
                                    <path d="M16 3v4"/>
                                </svg>
                            </span>
                            <p class="detail-value">{formattedDateTime}</p>
                        </div>
                        <div class="detail-row">
                            <span class="detail-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
                                     aria-hidden="true">
                                    <rect x="3" y="6" width="13" height="12" rx="2"/>
                                    <path d="m16 10 5-3v10l-5-3z"/>
                                </svg>
                            </span>
                            <p class="detail-value">Zoom</p>
                        </div>
                    </div>
                </div>

                <template lwc:if={showActions}>
                    <div class="action-buttons">
                        <template lwc:if={rescheduleBookingUrl}>
                            <a href={rescheduleBookingUrl} class="action-btn reschedule-btn">
                                Reschedule this appointment
                            </a>
                        </template>
                        <button class="action-btn cancel-btn" onclick={handleCancelClick}>
                            Cancel this appointment
                        </button>
                    </div>
                </template>
            </template>

            <!-- Cancel confirmation form (rendered BELOW the appointment
                 card above so the user sees a single combined view —
                 appointment summary on top, cancel form on the bottom,
                 separated by a divider). The appointment card and the
                 "Manage your appointment" header come from the
                 showAppointmentDetails block above and are not duplicated
                 here. -->
            <template lwc:if={showCancelForm}>
                <hr class="section-divider"/>

                <div class="cancel-form-header">
                    <div class="cancel-form-heading-block">
                        <h2 class="cancel-title">Cancel this meeting?</h2>
                        <p class="cancel-subtitle">Your counselor will be notified and the slot will reopen.</p>
                    </div>
                </div>

                <div class="cancel-form">
                    <div class="field-group">
                        <label class="field-lbl">
                            Reason for cancellation
                            <span class="field-lbl-required" aria-hidden="true">*</span>
                        </label>
                        <select class={reasonSelectClass} onchange={handleReasonChange}>
                            <option value="">Select a reason</option>
                            <option value="Schedule conflict">Schedule conflict</option>
                            <option value="No longer interested">No longer interested</option>
                            <option value="Found another program">Found another program</option>
                            <option value="Need more time to decide">Need more time to decide</option>
                            <option value="Other">Other</option>
                        </select>
                        <template lwc:if={reasonError}>
                            <div class="field-error">{reasonError}</div>
                        </template>
                    </div>

                    <template lwc:if={showOtherReason}>
                        <div class="field-group">
                            <label class="field-lbl">Please specify</label>
                            <textarea class={otherReasonInputClass}
                                      onchange={handleOtherReasonChange}
                                      oninput={handleOtherReasonChange}
                                      rows="3"
                                      placeholder="Let us know why you're cancelling..."></textarea>
                            <template lwc:if={otherReasonError}>
                                <div class="field-error">{otherReasonError}</div>
                            </template>
                        </div>
                    </template>

                    <div class="policy-banner">
                        <span>Cancellations within 24 hours may affect rescheduling. Please cancel at least 3 days in advance when possible.</span>
                    </div>

                    <template lwc:if={cancelError}>
                        <div class="val-error">{cancelError}</div>
                    </template>
                </div>

                <div class="form-footer">
                    <button class="back-btn" onclick={handleBackToDetails}>Keep meeting</button>
                    <button class="confirm-cancel-btn" onclick={handleConfirmCancel}
                            disabled={isCancelling}>
                        <template lwc:if={isCancelling}>Cancelling...</template>
                        <template lwc:else>Cancel meeting</template>
                    </button>
                </div>
            </template>

            <!-- Cancellation success -->
            <template lwc:if={showCancelSuccess}>
                <div class="success-panel">
                    <div class="success-icon">&#x2713;</div>
                    <h2 class="success-title">Appointment cancelled</h2>
                    <p class="success-text">Your consultation has been cancelled.</p>
                </div>
            </template>
        </div>
    </template>
</template>
